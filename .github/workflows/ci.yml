name: verify-and-build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: inference_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d inference_platform_test"
          --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_DSN: postgresql+asyncpg://app:app@127.0.0.1:5432/inference_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r services/api/requirements-dev.txt -r services/router/requirements-dev.txt
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps --no-shell chromium
        working-directory: web
      - run: python scripts/check.py
      - run: python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: artifacts/
  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: services/api
            dockerfile: services/api/Dockerfile
          - name: router
            context: .
            dockerfile: services/router/Dockerfile
          - name: web
            context: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: inference-platform/${{ matrix.name }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
