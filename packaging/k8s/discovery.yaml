apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-discovery
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-discovery
subjects:
  - kind: ServiceAccount
    name: inference-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-discovery
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: inference-discovery}
  template:
    metadata:
      labels: {app: inference-discovery}
    spec:
      serviceAccountName: inference-discovery
      containers:
        - name: discovery
          image: inference-platform/router:local
          command: [python, -m, ops.discovery]
          env:
            - {name: CONTROL_PLANE_URL, value: "http://inference-platform-api:8000"}
            - {name: ADMIN_KEY_FILE, value: /run/secrets/admin-key}
            - {name: DISCOVERY_STATE_DIR, value: /state}
            - {name: DISCOVERY_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: DISCOVERY_SERVICE, value: "replace-with-inference-service"}
            - {name: DISCOVERY_MODEL, value: "replace-with-logical-model"}
            - {name: DISCOVERY_PORT_NAME, value: "http"}
          volumeMounts:
            - {name: admin-key, mountPath: /run/secrets, readOnly: true}
            - {name: state, mountPath: /state}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: admin-key
          secret:
            secretName: inference-platform-admin-key
            items: [{key: admin-key, path: admin-key}]
        - name: state
          emptyDir: {}
